<!DOCTYPE html>
<html>
<head>
    <title>Test Login & Token</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Login & Token Storage</h1>
    
    <div class="section">
        <h3>Step 1: Login</h3>
        <input type="email" id="email" placeholder="Email" value="tiwariaditya1810@gmail.com" style="width: 300px; padding: 8px;">
        <input type="password" id="password" placeholder="Password" value="12345678" style="width: 200px; padding: 8px;">
        <button onclick="testLogin()">Test Login</button>
    </div>

    <div class="section">
        <h3>Step 2: Check Token</h3>
        <button onclick="checkToken()">Check SessionStorage Token</button>
        <button onclick="checkCookies()">Check Cookies</button>
    </div>

    <div class="section">
        <h3>Step 3: Test Protected Endpoint</h3>
        <button onclick="testProtectedEndpoint()">Get My Orders</button>
    </div>

    <div class="section">
        <h3>Results:</h3>
        <div id="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'section ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : '');
            div.innerHTML = '<strong>' + new Date().toLocaleTimeString() + ':</strong><br>' + message;
            results.insertBefore(div, results.firstChild);
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                log('🔐 Attempting login...');
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, useCookie: true })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Login successful!<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                    
                    if (data.token) {
                        sessionStorage.setItem('accessToken', data.token);
                        log('✅ Token saved to sessionStorage', 'success');
                    } else {
                        log('❌ No token in response!', 'error');
                    }
                } else {
                    log(`❌ Login failed: ${data.message}<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        function checkToken() {
            const token = sessionStorage.getItem('accessToken');
            if (token) {
                log(`✅ Token found in sessionStorage:<br>Length: ${token.length}<br>First 50 chars: ${token.substring(0, 50)}...`, 'success');
            } else {
                log('❌ No token in sessionStorage', 'error');
            }
        }

        function checkCookies() {
            const cookies = document.cookie;
            if (cookies) {
                log(`🍪 Cookies:<br><pre>${cookies}</pre>`, 'success');
            } else {
                log('❌ No cookies found', 'error');
            }
        }

        async function testProtectedEndpoint() {
            const token = sessionStorage.getItem('accessToken');
            
            if (!token) {
                log('❌ No token! Login first.', 'error');
                return;
            }
            
            try {
                log('🔍 Fetching orders...');
                const response = await fetch(`${API_URL}/tracking/test-orders`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Orders fetched!<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    log(`❌ Failed: ${data.error || data.message}<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
